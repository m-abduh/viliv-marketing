<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'Satoshi';src:url('./fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  :root{--ink:#141418;--accent:#c9a227;--muted:#9a9aa3}
  body{font-family:'Satoshi','Segoe UI',system-ui,-apple-system,sans-serif;background:#141418}
  #root{position:relative;width:1080px;height:1350px;overflow:hidden}
  .bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
  .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,14,.55) 0%,rgba(10,10,14,0) 30%,rgba(10,10,14,0) 55%,rgba(10,10,14,.78) 100%)}
  .stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:84px 70px 70px}
  .top{display:flex;justify-content:center;text-align:center;width:100%}
  .title{font-size:42px;font-weight:800;line-height:1.22;letter-spacing:-.3px;color:#fff;max-width:880px;margin-top:24px}
  .bottom{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;flex:1;width:100%;text-align:left}
  .num{font-size:150px;font-weight:800;line-height:.9;letter-spacing:-2px;color:rgba(255,255,255,.18)}
  .product{margin-top:14px;font-size:38px;font-weight:800;line-height:1.15;color:#fff}
  .shop{display:inline-flex;align-items:center;gap:11px;margin-top:24px;color:var(--accent);font-size:38px;font-weight:400;line-height:1.15;overflow-wrap:anywhere}
  .shop .ic{display:inline-flex;flex-shrink:0}
  .shop .ic svg{display:block;width:34px;height:34px}
</style>
</head>
<body>
<div id="root">
  <div class="bg" style="background-image:{{img}}"></div>
  <div class="overlay"></div>
  <div class="stage">
    <div class="top">
      <div class="title">{{title}}</div>
    </div>
    <div class="bottom">
      <div class="num">{{num}}</div>
      <div class="product">{{product}}</div>
      <div class="shop">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
        <span>{{link}}</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
