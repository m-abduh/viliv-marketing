<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'Satoshi';src:url('./fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  :root{--ink:#141418;--accent:#c9a227;--muted:#9a9aa3}
  body{font-family:'Satoshi','Segoe UI',system-ui,-apple-system,sans-serif;background:#fafafa}
  #root{position:relative;width:1080px;height:1350px;overflow:hidden;display:flex;flex-direction:column;padding:0 64px}
  .top{padding-top:56px}
  .word{font-size:56px;font-weight:900;letter-spacing:5px;color:var(--ink);text-transform:uppercase}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .title{font-size:46px;font-weight:800;line-height:1.18;letter-spacing:-.4px;color:var(--ink);text-align:center;max-width:860px}
  .imagewrap{margin-top:36px}
  .imghold{position:relative;width:640px;height:640px;border-radius:30px;overflow:hidden;background:#efeef1;box-shadow:0 22px 50px rgba(17,17,20,.16)}
  .img{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
  .num{margin-top:40px;font-size:30px;font-weight:800;letter-spacing:8px;color:var(--muted)}
  .product{margin-top:12px;font-size:36px;font-weight:800;line-height:1.15;color:var(--ink);text-align:center;max-width:900px}
  .shop{display:inline-flex;align-items:center;gap:10px;margin-top:14px;color:var(--accent);font-size:25px;font-weight:700;overflow-wrap:anywhere}
  .shop .ic{display:inline-flex;flex-shrink:0}
  .shop .ic svg{display:block;width:30px;height:30px}
</style>
</head>
<body>
<div id="root">
  <div class="top"><span class="word">viliv</span></div>
  <div class="stage">
    <div class="title">{{title}}</div>
    <div class="imagewrap">
      <div class="imghold">
        <div class="img" style="background-image:{{img}}"></div>
      </div>
    </div>
    <div class="num">{{num}}</div>
    <div class="product">{{product}}</div>
    <div class="shop">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
      <span>{{link}}</span>
    </div>
  </div>
</div>
</body>
</html>
