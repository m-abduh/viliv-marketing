<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'Satoshi';src:url('./fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  :root{--ink:#111114;--accent:#c9a227;--muted:#8a8a92}
  body{font-family:'Satoshi','Segoe UI',system-ui,-apple-system,sans-serif;background:#fff}
  #root{position:relative;width:1080px;height:1350px;overflow:hidden;display:flex;flex-direction:column;padding:0 70px}
  .topbar{display:flex;align-items:center;padding:44px 0 0}
  .word{font-size:42px;font-weight:900;letter-spacing:3px;color:var(--ink);text-transform:uppercase}
  .title{margin-top:30px;font-size:50px;font-weight:900;line-height:1.14;letter-spacing:-.5px;color:var(--ink);max-width:940px}
  .imghold{position:relative;margin-top:26px;width:100%;height:560px;border-radius:32px;overflow:hidden;background:#f2f2f4}
  .img{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
  .meta{display:flex;align-items:center;gap:16px;margin-top:34px}
  .product{font-size:30px;font-weight:800;color:var(--ink)}
  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 12px;border:2px solid var(--accent);border-radius:999px;font-size:20px;font-weight:800;letter-spacing:1px;color:var(--accent)}
  .link{margin-top:10px;font-size:24px;font-weight:700;color:var(--accent);overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="root">
  <div class="topbar">
    <span class="word">viliv</span>
  </div>
  <div class="title">{{title}}</div>
  <div class="imghold">
    <div class="img" style="background-image:{{img}}"></div>
  </div>
  <div class="meta">
    <span class="product">{{product}}</span>
    <span class="badge">{{badge}}</span>
  </div>
  <div class="link">{{link}}</div>
</div>
</body>
</html>
