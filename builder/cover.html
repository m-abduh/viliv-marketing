<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'Satoshi';src:url('./fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  :root{--ink:#ffffff;--accent:#f5d67b;--brand:#f5d67b}
  body{font-family:'Satoshi','Segoe UI',system-ui,-apple-system,sans-serif;background:#000}
  #root{position:relative;width:1080px;height:1350px;overflow:hidden}
  .bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.12) 35%,rgba(0,0,0,.78) 100%)}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:70px 64px 92px}
  .kicker{font-size:26px;font-weight:700;letter-spacing:5px;color:var(--accent);text-transform:uppercase;margin-bottom:24px}
  .title{font-size:74px;font-weight:900;line-height:1.08;letter-spacing:-1px;color:var(--ink);text-shadow:0 3px 24px rgba(0,0,0,.45);max-width:920px}
  .spacer{flex:1}
  .brand{display:flex;align-items:center;gap:14px;padding-top:30px;border-top:2px solid rgba(255,255,255,.35)}
  .brand .word{font-size:42px;font-weight:900;letter-spacing:2px;color:var(--ink)}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
</style>
</head>
<body>
<div id="root">
  <div class="bgimg" style="background-image:url('{{bg}}')"></div>
  <div class="shade"></div>
  <div class="content">
    <div class="kicker">{{kicker}}</div>
    <div class="spacer"></div>
    <div class="title">{{hook}}</div>
    <div class="brand"><span class="word">viliv</span><span class="dot"></span></div>
  </div>
</div>
</body>
</html>
