<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'Satoshi';src:url('./fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  :root{--ink:#ffffff;--accent:#f5d67b;--brand:#ffffff}
  body{font-family:'Satoshi','Segoe UI',system-ui,-apple-system,sans-serif;background:#0e0e10}
  #root{position:relative;width:1080px;height:1350px;overflow:hidden;background:linear-gradient(160deg,#17171a 0%,#26262c 55%,#0f0f11 100%)}
  .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
  .shade{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(10,10,12,0) 0%,rgba(10,10,12,.55) 55%,rgba(10,10,12,.92) 100%),
    linear-gradient(90deg,rgba(10,10,12,.38) 0%,rgba(10,10,12,0) 60%)}
  .top{position:absolute;top:70px;left:64px;display:flex;align-items:center;gap:14px}
  .word{font-size:56px;font-weight:900;letter-spacing:5px;color:var(--ink)}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 64px 88px}
  .kicker{font-size:21px;font-weight:700;letter-spacing:5px;color:var(--accent);text-transform:uppercase;margin-bottom:22px}
  .title{font-size:74px;font-weight:900;line-height:1.08;letter-spacing:-1.5px;color:var(--ink);max-width:920px}
  .scroll{display:flex;align-items:center;gap:16px;margin-top:54px;color:rgba(255,255,255,.5)}
  .scroll .label{font-size:19px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase}
  .scroll .chev{display:flex;align-items:center;gap:6px}
  .scroll .chev i{display:block;width:13px;height:13px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);transform:rotate(45deg)}
  .scroll .chev i:last-child{margin-left:-7px;opacity:.35}
</style>
</head>
<body>
<div id="root">
  <div class="bgimg" style="background-image:{{bg}}"></div>
  <div class="shade"></div>
  <div class="top"><span class="word">viliv</span></div>
  <div class="content">
    <div class="kicker">{{kicker}}</div>
    <div class="title">{{hook}}</div>
    <div class="scroll">
      <span class="chev"><i></i><i></i></span>
      <span class="label">Swipe to explore</span>
    </div>
  </div>
</div>
</body>
</html>
